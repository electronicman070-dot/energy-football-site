<script>

const ADMIN_PASSWORD = "f.energyatomic";


function login(){

    const password =
        document.getElementById("password").value;

    if(password === ADMIN_PASSWORD){

        document.getElementById("loginPage").style.display =
            "none";

        document.getElementById("dashboard").style.display =
            "block";

    }else{

        document.getElementById("loginError").style.display =
            "block";

    }

}


function logout(){

    document.getElementById("dashboard").style.display =
        "none";

    document.getElementById("loginPage").style.display =
        "flex";

    document.getElementById("password").value = "";

}


function savePoll(){

    const question =
        document.getElementById("pollQuestion").value;

    localStorage.setItem(
        "pollQuestion",
        question
    );

    document.getElementById("pollResult").innerText =
        "نظرسنجی ذخیره شد ✓";

}


function saveGame(){

    localStorage.setItem(
        "gameDate",
        document.getElementById("gameDate").value
    );

    localStorage.setItem(
        "gameTime",
        document.getElementById("gameTime").value
    );

    localStorage.setItem(
        "gamePlace",
        document.getElementById("gamePlace").value
    );

    localStorage.setItem(
        "gameMap",
        document.getElementById("gameMap").value
    );

    alert("اطلاعات بازی ذخیره شد ✓");

}


function saveMessage(){

    const message =
        document.getElementById("adminMessage").value;

    localStorage.setItem(
        "adminMessage",
        message
    );

    document.getElementById("messageResult").innerText =
        "پیام منتشر شد ✓";

}


function addAdmin(){

    const name =
        document.getElementById("newAdmin").value;

    const password =
        document.getElementById("newAdminPassword").value;

    if(name === "" || password === ""){

        alert("نام و رمز مدیر را وارد کنید.");

        return;

    }

    localStorage.setItem(
        "admin_" + name,
        password
    );

    document.getElementById("adminResult").innerText =
        "مدیر جدید اضافه شد ✓";

}

</script>

</body>
</html>
