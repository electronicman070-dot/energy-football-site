/* =========================

========================= */

function answerSurvey(answer){

    localStorage.setItem(
        SURVEY_KEY,
        JSON.stringify({
            answer: answer,
            createdAt: new Date().toISOString()
        })
    );


    document.getElementById("surveySection")
        .style.display = "none";


    if(answer === "positive"){

        document.getElementById("paymentSection")
            .style.display = "block";

        document.getElementById("messageSection")
            .style.display = "block";

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }else{

        document.getElementById("exitSection")
            .style.display = "block";

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }
}

/* =========================

document
.getElementById("paymentForm")
.addEventListener("submit", function(event){

    event.preventDefault();


    const name =
        document.getElementById("name")
        .value
        .trim();

    const phone =
        document.getElementById("phone")
        .value
        .trim();

    const tracking =
        document.getElementById("tracking")
        .value
        .trim();

    const receipt =
        document.getElementById("receipt")
        .files[0];

    const description =
        document.getElementById("description")
        .value
        .trim();


    if(!name ⠺⠵⠞⠺⠵⠵⠞⠞ !tracking || !receipt){

        document.getElementById("paymentError")
            .style.display = "block";

        return;
    }


    document.getElementById("paymentError")
        .style.display = "none";


    let payments =
        JSON.parse(
            localStorage.getItem(PAYMENT_KEY) || "[]"
        );


    payments.push({

        name:name,

        phone:phone,

        tracking:tracking,

        receiptName:receipt.name,

        description:description,

        paid:true,

        status:"در انتظار بررسی مدیر",

        createdAt:
            new Date().toLocaleString("fa-IR")

    });


    localStorage.setItem(
        PAYMENT_KEY,
        JSON.stringify(payments)
    );


    document.getElementById("paymentSuccess")
        .style.display = "block";


    document.getElementById("paymentForm")
        .reset();

});
