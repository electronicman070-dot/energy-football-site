<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل مدیریت | بچه‌های سالن</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="screen">
  <div class="login-box">
    <img src="assets/logo.png" class="logo" alt="لوگو">
    <h1>پنل مدیریت</h1>
    <div class="subtitle">بچه‌های سالن | مدرسه انرژی اتمی</div>
    <label>رمز عبور</label>
    <input id="password" type="password" placeholder="رمز عبور را وارد کنید" autocomplete="off">
    <button id="loginBtn" class="primary">ورود به پنل</button>
    <p id="error" class="error"></p>
  </div>
</div>

<div id="panel" class="hidden">
<header class="header">
  <div class="brand"><img src="assets/logo.png" class="logo small" alt="لوگو"><div><b>پنل مدیریت</b><small>بچه‌های سالن | مدرسه انرژی اتمی</small></div></div>
  <button id="logout" class="logout">خروج</button>
</header>
<main>
<h1 class="page-title">مدیریت سایت</h1>
<div class="cards">
  <button class="card" data-title="مدیریت بازی‌ها"><span>⚽</span><b>بازی‌ها</b><small>ثبت و مدیریت بازی‌های هفته</small></button>
  <button class="card" data-title="مدیریت بازیکنان"><span>♟</span><b>بازیکنان</b><small>افزودن و مدیریت بازیکنان</small></button>
  <button class="card" data-title="نظرسنجی"><span>▤</span><b>نظرسنجی</b><small>ساخت و مدیریت نظرسنجی</small></button>
  <button class="card" data-title="پرداخت‌ها"><span>▣</span><b>پرداخت‌ها</b><small>ثبت و بررسی پرداخت‌ها</small></button>
  <button class="card" data-title="پیام مدیریت"><span>✉</span><b>پیام مدیریت</b><small>نمایش پیام در صفحه اصلی</small></button>
  <button class="card" data-title="آمار"><span>▥</span><b>آمار</b><small>مشاهده آمار ثبت‌شده</small></button>
</div>
<div class="note">اطلاعات واقعی پس از اتصال بخش‌های مدیریتی ثبت و در سایت اصلی نمایش داده می‌شوند.</div>
</main>
</div>

<div id="modal" class="modal hidden"><div class="modalbox"><button id="close">×</button><h2 id="mt"></h2><p>این بخش در مرحله بعد به فرم‌های واقعی مدیریت متصل می‌شود.</p><button id="ok" class="primary">باشه</button></div></div>
<script src="script.js"></script>
</body></html>
